tools:
- name: inspect_stereo_pair
  description: Verify bounded software SBS images, camera metadata, image hashes and
    exact left-right pixel composition. Scene, disparity and device acceptance require separate evidence.
  source_file: scripts/inspect_stereo_pair.py
  execution: sync
  affinity: any
  enforce_thread_affinity: true
  timeout_hint_secs: 60
  read_only: true
  destructive: false
  idempotent: true
  annotations:
    read_only_hint: true
    destructive_hint: false
    idempotent_hint: true
    open_world_hint: false
  input_schema:
    type: object
    properties:
      pair_path:
        type: string
        description: Absolute existing pair.json next to the labelled native left, right and SBS PNG files
    required: [pair_path]
    additionalProperties: false
  output_schema:
    type: object
    properties:
      success:
        type: boolean
      context:
        type: object
        properties:
          scene_acceptance:
            const: NOT_RUN
          disparity_acceptance:
            const: NOT_RUN
          hardware_verified:
            const: false
          installation_authorized:
            const: false
          host_actions_executed:
            const: false
        additionalProperties: true
    additionalProperties: true
  next-tools:
    on-failure:
    - unreal_spatiallabs__inspect_software_evidence
- name: inspect_software_evidence
  description: Compare specified UE runtime and installation identities, audit declared
    GameFeatureData dependencies, and inspect cold or warm native capture evidence.
    Does not launch, modify, accept support, or pass scene readiness without visual review.
  source_file: scripts/inspect_software_evidence.py
  execution: sync
  affinity: any
  enforce_thread_affinity: true
  timeout_hint_secs: 60
  read_only: true
  destructive: false
  idempotent: true
  annotations:
    read_only_hint: true
    destructive_hint: false
    idempotent_hint: true
    open_world_hint: false
  input_schema:
    type: object
    properties:
      project_path:
        type: string
        description: Absolute exact editable .uproject file; resolve delivery directories with inspect_project first
      engine_root:
        type: string
        description: Absolute existing Engine directory, containing Build/Build.version
      run_log_path:
        type: string
        description: Absolute existing finalized native UE log; no commands in it are executed
      capture_path:
        type: string
        description: Optional absolute native RGB/RGBA PNG to check against that log
      cache_state:
        type: string
        enum: [cold, warm, unknown]
        default: unknown
        description: Reported cache state of this one run; never inferred from success
    required: [project_path, engine_root, run_log_path]
    additionalProperties: false
  output_schema:
    type: object
    properties:
      success:
        type: boolean
      context:
        type: object
        properties:
          compatibility_status:
            enum: [unknown]
          hardware_verified:
            const: false
          installation_authorized:
            const: false
          host_actions_executed:
            const: false
        additionalProperties: true
    additionalProperties: true
  next-tools:
    on-failure:
    - unreal_spatiallabs__inspect_project
- name: inspect_project
  description: Locate an editable Unreal project in a bounded delivery-folder scan,
    inspect it and report missing SpatialLabs prerequisites without loading vendor code.
  source_file: scripts/inspect_project.py
  execution: sync
  affinity: any
  enforce_thread_affinity: true
  timeout_hint_secs: 60
  read_only: true
  destructive: false
  idempotent: true
  annotations:
    read_only_hint: true
    destructive_hint: false
    idempotent_hint: true
    open_world_hint: false
  input_schema:
    type: object
    properties:
      project_path:
        type: string
        description: Absolute .uproject, project directory or delivery folder for read-only bounded discovery
      environment:
        type: object
        description: Reported environment; never treated as verified hardware
    required:
    - project_path
    additionalProperties: false
  output_schema:
    type: object
    additionalProperties: true
  next-tools:
    on-failure:
    - unreal_spatiallabs__inspect_project
- name: plan_install
  description: Prepare a hash-bound project-only plan; unknown official compatibility
    blocks installation.
  source_file: scripts/plan_install.py
  execution: sync
  affinity: any
  enforce_thread_affinity: true
  timeout_hint_secs: 60
  read_only: true
  destructive: false
  idempotent: true
  annotations:
    read_only_hint: true
    destructive_hint: false
    idempotent_hint: true
    open_world_hint: false
  input_schema:
    type: object
    properties:
      project_path:
        type: string
      plugin_version:
        type: string
      engine_version:
        type: string
      source_url:
        type: string
      support_evidence:
        type: object
        description: Current reviewed official matrix record, not consent
      license_evidence:
        type: object
        description: Exact reviewed license content_sha256, official source_url and
          checked_at; not consent
    required:
    - project_path
    - plugin_version
    - engine_version
    - source_url
    additionalProperties: false
  output_schema:
    type: object
    additionalProperties: true
  next-tools:
    on-failure:
    - unreal_spatiallabs__inspect_project
- name: validate_archive
  description: Validate bounded local ZIP paths, CRC, declared versions and Win64
    support without executing files.
  source_file: scripts/validate_archive.py
  execution: sync
  affinity: any
  enforce_thread_affinity: true
  timeout_hint_secs: 60
  read_only: true
  destructive: false
  idempotent: true
  annotations:
    read_only_hint: true
    destructive_hint: false
    idempotent_hint: true
    open_world_hint: false
  input_schema:
    type: object
    properties:
      archive_path:
        type: string
      plugin_version:
        type: string
      engine_version:
        type: string
    required:
    - archive_path
    - plugin_version
    - engine_version
    additionalProperties: false
  output_schema:
    type: object
    additionalProperties: true
  next-tools:
    on-failure:
    - unreal_spatiallabs__inspect_project
- name: analyze_performance
  description: Compare matching measured runs with CPU/GPU frame times and separate
    rendered/generated FPS.
  source_file: scripts/analyze_performance.py
  execution: sync
  affinity: any
  enforce_thread_affinity: true
  timeout_hint_secs: 15
  read_only: true
  destructive: false
  idempotent: true
  annotations:
    read_only_hint: true
    destructive_hint: false
    idempotent_hint: true
    open_world_hint: false
  input_schema:
    type: object
    properties:
      baseline:
        type: object
      candidate:
        type: object
    required:
    - baseline
    - candidate
    additionalProperties: false
  output_schema:
    type: object
    additionalProperties: true
  next-tools:
    on-failure:
    - unreal_spatiallabs__inspect_project
- name: acceptance_report
  description: Assess evidence per run and acceptance layer; absent physical hardware
    forces device checks NOT_RUN.
  source_file: scripts/acceptance_report.py
  execution: sync
  affinity: any
  enforce_thread_affinity: true
  timeout_hint_secs: 15
  read_only: true
  destructive: false
  idempotent: true
  annotations:
    read_only_hint: true
    destructive_hint: false
    idempotent_hint: true
    open_world_hint: false
  input_schema:
    type: object
    properties:
      evidence:
        type: object
    required:
    - evidence
    additionalProperties: false
  output_schema:
    type: object
    additionalProperties: true
  next-tools:
    on-failure:
    - unreal_spatiallabs__inspect_project
- name: prepare_software_plan
  description: Prepare a bounded, hash-bound Unreal source project software validation
    plan from discovered tool schemas. Does not call tools or authorize execution.
  source_file: scripts/prepare_software_plan.py
  execution: sync
  affinity: any
  enforce_thread_affinity: true
  timeout_hint_secs: 60
  read_only: true
  destructive: false
  idempotent: true
  annotations:
    read_only_hint: true
    destructive_hint: false
    idempotent_hint: true
    open_world_hint: false
  input_schema:
    type: object
    properties:
      project_path:
        type: string
      instance_id:
        type: string
      instance_short:
        type: string
      max_attempts:
        type: integer
        minimum: 1
        maximum: 2
      steps:
        type: array
        maxItems: 32
        items:
          type: object
    required:
    - project_path
    - instance_id
    - steps
    additionalProperties: false
  output_schema:
    type: object
    additionalProperties: true
  next-tools:
    on-failure:
    - unreal_spatiallabs__inspect_project
